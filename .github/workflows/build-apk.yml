name: Build Tanzeb V2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract Tanzeb V2
        run: |
          unzip -q TanzebGallery-V2-ALBUM-PRIVATE.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Find Android Project
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build V2 APK
        run: |
          cd project/TanzebGallery
          gradle assembleDebug

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeb-Gallery-V2
          path: project/TanzebGallery/app/build/outputs/apk/debug/app-debug.apk
          
