name: Build Tanzeb Game Hub APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android ZIP
        run: |
          unzip -o TanzebGameHub-Android.zip
          cp -r TanzebGameHub/* .
          cp -r TanzebGameHub/.[!.]* . 2>/dev/null || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeb-Game-Hub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
