name: Build Tanzeb Game Hub APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract Game Hub
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q TanzebGameHub-Android.zip -d build-project

      - name: Build APK
        working-directory: build-project/TanzebGameHub
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeb-Game-Hub-APK
          path: build-project/TanzebGameHub/app/build/outputs/apk/debug/app-debug.apk     
